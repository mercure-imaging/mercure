[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiofiles>=23.2.1",
    # security floors for transitive dependencies (see the same block in requirements.in)
    "anyio>=4.15.1",
    "idna>=3.15",
    "pygments>=2.20.0",
    "asteval>=1.0.9",
    "aiohttp>=3.14.4",
    "aiosqlite~=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bleach>=6.4.0",
    "boto3>=1.43.118",
    "certifi>=2024.7.4",
    "daiquiri>=3.4.0",
    "databases[aiopg]<=0.9.0",
    "dataclasses ; python_full_version < '3.7'",
    "distro>=1.9.0",
    "docker>=7.2.0",
    "freezegun>=1.5.5",
    "future>=0.18.3",
    "graphyte>=1.7.1",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "hupper>=1.12.1",
    "influxdb-client>=1.50.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "mako>=1.4.2",
    "mypy<1.9.0",
    # dependencies of the vendored app/dicomweb_client (see app/dicomweb_client/VENDORED.md)
    "numpy>=1.26,<2",
    "passlib>=1.7.4",
    "psycopg2>=2.9.13",
    "pydantic>=1.10.9,<2.0.0",
    "pydicom~=2.4.5",
    "pyfakefs==5.3.5",
    "pynetdicom~=2.0.2",
    "pytest>=8.2.2,<9",
    "pytest-mock>=3.17.0",
    "pytest-subprocess>=1.6.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "python-nomad>=2.1.0",
    "pyxnat>=1.6.4",
    "requests>=2.33.0",
    "retrying>=1.4.2",
    "rq~=1.16.2",
    "rq-scheduler~=0.14.0",
    "sphinx==5.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sqlalchemy<=1.4.52",
    "starlette>=1.3.1,<1.8",
    "starlette-auth-toolkit>=0.5.0",
    "starlette-decorouter>=1.0.0",
    "types-bleach>=6.4.0.20260728",
    "types-jinja2>=2.11.9",
    "types-python-dateutil>=2.9.0.20241003",
    "types-requests>=2.33.0.20261006",
    "typing-extensions>=4.16.0",
    "urllib3>=2.8.0",
    "uvicorn>=0.54.0",
    "watchdog>=4.0.1",
    "wheel>=0.46.2",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=1.0.0",
    "requests-toolbelt>=1.0.0",
    "supervisor>=4.3.0",
]

[tool.mypy]  
plugins = ["sqlmypy"]
ignore_missing_imports = true