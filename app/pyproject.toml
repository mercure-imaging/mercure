[project]
name = "app"
version = "0.1.0"
# Dependabot reads requires-python to pick the interpreter it resolves dependencies for, and so do
# the pip-compile banner in app/requirements.txt and CI. Keep them saying the same thing: when the
# runtime moved once, the banner was left behind and the lockfile silently lost exceptiongroup and
# tomli.
requires-python = ">=3.10,<3.13"

# No dependency declarations here, on purpose.
#
# Dependency versions live in app/requirements.in and app/dev-requirements.in, with their
# pip-compile output in app/requirements.txt and app/dev-requirements.txt. Nothing installs from
# this file: CI, install.sh and installation/install-env.sh all install the requirements files.
#
# This file used to carry a hand-synchronised PEP 621 [project] dependencies table and a
# [dependency-groups] dev group. A PEP 621 table makes this a manifest as far as Dependabot is
# concerned, and it then opened update PRs that raised those constraints while leaving
# app/requirements.txt - the file that actually ships - untouched. CI stayed green on those PRs
# because CI installs the requirements files, so the checks proved nothing. The mirror had also
# drifted on its own (it claimed pytest-asyncio>=1.0.0 while dev-requirements.txt pinned 0.24.0).

[tool.mypy]
plugins = ["sqlmypy"]
ignore_missing_imports = true
