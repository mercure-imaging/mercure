[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
disallow_untyped_calls = True
check_untyped_defs = True
pretty = True
namespace_packages = False
plugins = pydantic.mypy
exclude = (env)
mypy_path = app

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_untyped_fields = True

# Vendored third-party copy, see app/dicomweb_client/VENDORED.md. It is not written against
# mercure's strict typing settings and is not edited by hand, so it is not type-checked.
# --exclude on the command line is not enough: mypy still analyses followed imports.
[mypy-dicomweb_client.*]
ignore_errors = True
