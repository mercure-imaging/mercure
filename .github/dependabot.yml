---
# Dependabot configuration.
#
# This file enables *version* updates. Security updates are controlled by the separate
# repo/org "Dependabot security updates" setting (they ignore the schedule and are subject to
# their own fixed limit of 10 open PRs). Auto-merge for security updates is also a repo setting.
#
# Python layout, for whoever finds this in a year:
#   app/requirements.in      -> app/requirements.txt      (appliance runtime)
#   app/dev-requirements.in  -> app/dev-requirements.txt  (tests; compiled with -c requirements.txt)
# The .txt files are pip-compile output and must not be hand-edited. Dependabot treats them as
# lockfiles: it pairs each generated .txt with its .in through the "autogenerated by pip-compile"
# banner, edits the .in, and regenerates the .txt in the same pull request.
#
# Python version: Dependabot resolves for the version named in the requirements.txt banner and in
# app/pyproject.toml (requires-python). Both say 3.10, matching the appliance and CI. When the
# runtime moves, move both together, otherwise Dependabot will produce a lockfile that cannot
# install on 3.10 - that is exactly how exceptiongroup and tomli once went missing.
#
# Dependabot regenerates the lockfiles with pip-tools 7.5.3, so its PRs will rewrite the banner
# from "pip-compile 7.6.2" to 7.5.3. That is expected, not a mistake to undo.

version: 2

updates:
  # ------------------------------------------------------------------- Python
  - package-ecosystem: pip
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
    # Only affects version updates. Five (the default) is easy to saturate with cosmetic bumps,
    # which then queues a real advisory behind them.
    open-pull-requests-limit: 15
    # The .in files state what the maintainers allow; Dependabot may move the resolved version
    # inside that range, but may not rewrite the range. This is not cosmetic: with the default
    # "auto"/"increase" behaviour Dependabot opened PRs that turned `pydantic >=1.10.9,<2.0.0`
    # into `>=2.14.1,<3.0.0`, `sqlalchemy<=1.4.52` into 2.0.x and `sphinx==5.0.0` into 8.x -
    # architecture decisions presented as routine bumps, and CI passed them because CI installs
    # the lockfile. Raising a ceiling is a migration; do it by hand with pip-compile --upgrade.
    #
    # Consequence to remember: if an advisory is only fixed above a ceiling we declared, security
    # updates cannot fix it either and the alert stays open for a human. That is the correct
    # outcome, not a malfunction.
    versioning-strategy: lockfile-only
    cooldown:
      # Don't chase a release the day it lands. (3 days is already the product default; stated
      # so the intent survives whoever edits this file next.)
      default-days: 3
    commit-message:
      prefix: deps
      prefix-development: deps(dev)
      include: scope
    groups:
      # One PR for patch+minor churn; majors stay individual because each one is a decision.
      # Note the spelling here: groups use bare minor/patch/major, whereas ignore conditions
      # below use the version-update:semver-* form. They are genuinely different.
      python-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    ignore:
      # Each entry mirrors a deliberate ceiling in app/requirements.in.
      # Careful: ignore conditions filter security updates too, so keep these narrow and delete
      # each one as soon as the migration it describes has happened.
      - dependency-name: starlette
        # 1.8.0 requires Python >= 3.11; 1.0.0-1.7.0 is the last 3.10-compatible line. Belt and
        # braces: requires-python normally stops Dependabot proposing 1.8+ anyway.
        versions:
          - ">=1.8"
      - dependency-name: pydicom
        # Pinned ~=2.4.5. pydicom 3 is an API migration, and app/dicomweb_client (vendored) is
        # written against 2.x; upstream dicomweb-client 0.61+ is what demands pydicom 3.
        versions:
          - ">=3"
      - dependency-name: numpy
        # Held <2 so the vendored dicomweb_client keeps running on today's stack. NumPy 2 itself
        # looks fine (0.60.1 uses np.prod, not the removed np.product) but needs a pydicom pass.
        versions:
          - ">=2"
      - dependency-name: pytest
        # pytest 9 needs pytest-asyncio >=1.3 (0.24.0 and 1.0.x both cap pytest <9) plus a re-check
        # of the asyncio-marked tests. Separate change, on purpose.
        versions:
          - ">=9"

  # -------------------------------------------------------------- GitHub Actions
  # checkout@v2/v3, setup-python@v2, and four docker/* actions pinned to full commit SHAs.
  # Dependabot updates SHA pins too and refreshes the trailing comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  # ----------------------------------------------------------------- Base image
  # Only docker/base has a literal FROM; the service images are built FROM $BASE_IMAGE_NAME and
  # follow it automatically. The apt packages installed in that layer (dcmtk, libpq-dev, python3,
  # tzdata, ...) are NOT tracked by Dependabot at all - they only move when the image is rebuilt.
  - package-ecosystem: docker
    directory: "/docker/base"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
    ignore:
      # This image is where the appliance gets its Python: 22.04 ships 3.10, 23.10 ships 3.11 and
      # 24.04 ships 3.12. Dependabot offered 23.10, which is an interim release that is already
      # end-of-life. Stay on the 22.04 LTS line; moving to 24.04 is a planned migration with
      # starlette/numpy consequences, and starts by editing this line.
      - dependency-name: ubuntu
        versions:
          - ">=23.04"

# --------------------------------------------------------------------------------------
# Deliberately not configured, and why:
#
# * uv / app/uv.lock - removed on this branch. Nothing installs from it: no Dockerfile, workflow or
#   script runs `uv`, while the file accounted for roughly half of this repo's open Dependabot
#   alerts, all duplicates of ones already raised against requirements.txt. Don't re-add it without
#   first making uv the single source of truth. If that happens, enable it here with
#   `enable-beta-ecosystems: true` at the top level plus a
#   "- package-ecosystem: uv / directory: /app" entry.
#
# * app/dicomweb_client/ - a vendored third-party copy (~9.3k LOC). Dependabot cannot see inside
#   it and will never alert for it. app/dicomweb_client/VENDORED.md records the upstream version
#   and the refresh procedure; checking it stays manual, or becomes a scheduled workflow that
#   compares the recorded version against PyPI.
#
# * app/bin/getdcmtags - a bundled DCMTK-based binary. Same blind spot, and no registry to watch:
#   tracked by hand against DCMTK advisories.
#
# * app/pyproject.toml - metadata only. It deliberately declares no dependencies, so that
#   requirements.in and dev-requirements.in stay the only place a version range is written down.
#   requires-python still lives here and is still read: it is one of the two signals that keep
#   Dependabot resolving for Python 3.10.
#
# * labels / assignees / reviewers left unset: labels must already exist in the repo and assignees
#   need write access. For automated routing prefer a .github/CODEOWNERS entry for
#   /app/requirements*.in, /app/requirements*.txt and /app/dicomweb_client/ - security updates
#   request review from code owners without anything in this file.
