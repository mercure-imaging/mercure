# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: 3.10.13
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential dcmtk inetutils-ping libqt5core5a redis
        python -m pip install --upgrade pip setuptools wheel
        pip install pip-tools 
        pip install flake8 pytest pytest-asyncio 
        #pip-sync app/requirements.txt app/dev-requirements.txt
        pip install -r app/requirements.txt
        pip install -r app/dev-requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --ignore=F824 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --statistics
    - name: typecheck with mypy
      run: |
        mypy --exclude app/tests --exclude getdcmtags --exclude app/dicomweb_client --no-namespace-packages .
    # Split in two on purpose. The test files that need no live services run across all CPUs
    # (~100s -> ~35s on a 4-core runner). app/tests/integration stays serial: it starts
    # supervisord-managed services that share one Redis (127.0.0.1:6379) through the fixed queue
    # names mercure_fast/mercure_slow, so concurrent runs would pick up each other's jobs. Its
    # temp dirs and ports are already per-test, so Redis is the only thing to fix to parallelise it.
    - name: Test with pytest (parallel)
      if: always()
      run: |
        python -m pytest -vvv -n auto --ignore=app/tests/integration
    - name: Test with pytest (integration, serial)
      if: always()
      run: |
        python -m pytest -vvv app/tests/integration
    - name: Check getdcmtags version
      run: |
        cd getdcmtags && ./check_version.sh
