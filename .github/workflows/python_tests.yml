# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    # Pinned to the Ubuntu release this workflow was developed/tested against. 
    runs-on: ubuntu-24.04

    env:
      # Single source of truth for the apt packages. The cache key below is a hash of this
      # string, so editing the list automatically gets a fresh cache key; nothing to bump by hand.
      APT_PACKAGES: build-essential dcmtk inetutils-ping libqt5core5a redis

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        # Do not pin the patch level
        python-version: "3.10"
        # Reuses the pip wheel cache between runs. Only pays off when the requirements
        # files are unchanged (the usual case for code-only PRs); the key below falls back
        # to a partial restore when they do change.
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          app/dev-requirements.txt
    # Caches the downloaded .debs, not the installed packages: apt-get install still runs
    # every time (a fresh runner has nothing installed), but fetches them from cache instead
    # of Docker Hub/Ubuntu mirrors. The key is the hash of APT_PACKAGES, so changing the list
    # starts a new cache automatically. A stale partial restore is harmless anyway: apt
    # verifies each .deb against the index checksums and re-downloads on mismatch.
    - name: Hash apt package list
      id: apt-pkgs
      run: echo "key=$(printf '%s' "${APT_PACKAGES// /-}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Cache apt packages
      uses: actions/cache@v6
      with:
        path: /var/cache/apt
        key: apt-${{ runner.os }}-${{ steps.apt-pkgs.outputs.key }}
        restore-keys: apt-${{ runner.os }}-
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $APT_PACKAGES
        python -m pip install --upgrade pip setuptools wheel
        pip install pip-tools 
        pip install flake8 pytest pytest-asyncio 
        #pip-sync app/requirements.txt app/dev-requirements.txt
        pip install -r app/requirements.txt
        pip install -r app/dev-requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --ignore=F824 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --statistics
    - name: typecheck with mypy
      run: |
        mypy --exclude app/tests --exclude getdcmtags --exclude app/dicomweb_client --no-namespace-packages .
    # The whole suite runs in parallel across all CPUs (~105s -> ~35s on a 4-core runner)
    - name: Test with pytest
      run: |
        python -m pytest -vvv -n auto
    - name: Check getdcmtags version
      run: |
        cd getdcmtags && ./check_version.sh
